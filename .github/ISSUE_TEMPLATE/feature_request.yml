name: Feature request
description: A missing route, field or convenience
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The workflow you are building, not only the call you are missing.
    validations:
      required: true

  - type: input
    id: route
    attributes:
      label: The CRMCalls route, if you know it
      placeholder: "GET /api/v1/calls"

  - type: textarea
    id: docs
    attributes:
      label: Where it is documented
      description: >
        The API documentation lives inside the CRMCalls account, under Интеграции → API →
        Документация. Until a route has an operation of its own, Custom Request calls it with
        the same key and rate limit.
